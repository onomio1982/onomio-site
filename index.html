<meta name="description" content="Onomio: reminders for birthdays, name days and holidays, with ready-made wishes in 8 languages.">
<meta name="theme-color" content="#E3346E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon-48.png">

<title>Onomio – Name Days & Wishes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Commissioner:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, festive wordmark band on top, list of upcoming occasions, bottom-sheet composer */
:root{
  --bg:#F6F4FF; --surface:#FFFFFF; --ink:#1D1736; --muted:#6A6387; --line:#E3DFF3;
  --accent:#E3346E; --accent-ink:#FFFFFF; --soft:#FCE6EE;
  --sun:#E9A912; --mint:#0F9F90; --violet:#6A55F0; --ok:#178A55;
  --f-display:"Comfortaa","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Commissioner","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13101F; --surface:#1D1830; --ink:#F2EFFF; --muted:#A59DC6; --line:#2F2948;
  --accent:#FF5E92; --accent-ink:#1A0C14; --soft:#3A1D2D;
  --sun:#FFC845; --mint:#3DD6C4; --violet:#9C8CFF; --ok:#4FD08E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13101F; --surface:#1D1830; --ink:#F2EFFF; --muted:#A59DC6; --line:#2F2948;
  --accent:#FF5E92; --accent-ink:#1A0C14; --soft:#3A1D2D;
  --sun:#FFC845; --mint:#3DD6C4; --violet:#9C8CFF; --ok:#4FD08E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

header.top{padding-top:22px;display:flex;flex-direction:column;gap:10px;position:relative}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:-.5px;line-height:1}
.logo span:nth-child(1){color:var(--accent)} .logo span:nth-child(2){color:var(--sun)} .logo span:nth-child(3){color:var(--mint)}
.logo span:nth-child(4){color:var(--violet)} .logo span:nth-child(5){color:var(--accent)} .logo span:nth-child(6){color:var(--sun)}
.logo span:nth-child(7){color:var(--mint)}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dots{position:absolute;right:0;top:18px;width:120px;height:56px;pointer-events:none}
.proto{font-size:12px;color:var(--muted)}

.todaycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.todaycard h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.todaycard p{margin:0}
.todaycard .names{font-weight:600}
.cc{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:6px;background:var(--line);color:var(--muted);margin-right:6px;vertical-align:1px}

nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:999px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.banner{background:var(--soft);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{margin:6px 0 0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ev{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.ev:hover{border-color:var(--violet)}
.ev .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.ev .body{min-width:0}
.ev .t{font-weight:700;display:block}
.ev .who{color:var(--muted);font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .when{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--ink)}
.pill.today{background:var(--accent);color:var(--accent-ink)}
.pill.done{background:transparent;color:var(--ok);padding:0}
.t-birthday .ic{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.t-nameday .ic{background:color-mix(in srgb,var(--violet) 16%,transparent)}
.t-holiday .ic{background:color-mix(in srgb,var(--sun) 20%,transparent)}
.t-love .ic{background:color-mix(in srgb,var(--accent) 12%,transparent)}

.person{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);color:#fff}
.person .meta{color:var(--muted);font-size:13px}
.person .name{font-weight:700}
.ex{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:600}
.ghost.danger{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.small{font-size:13px;color:var(--muted);margin:0}

dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgb(10 6 25 / .5)}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);
  border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet h2{margin:0;font-family:var(--f-display);font-size:21px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.chip .ok{color:var(--ok)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.send{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.send a,.send button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-decoration:none;color:var(--ink);font-weight:600;font-size:12.5px;background:transparent}
.send a b,.send button b{font-size:19px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.lock{font-size:11px;font-weight:700;color:var(--violet);margin-left:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.empty{text-align:center;color:var(--muted);padding:24px}
[hidden]{display:none!important}
</style>
</head>

</div>

const NOW = new Date(); const T0 = new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()); const Y = T0.getFullYear();
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
function westernEaster(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
 h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;
 return new Date(y,Math.floor(n/31)-1,(n%31)+1);}
function orthodoxEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,n=d+e+114;
 return addDays(new Date(y,Math.floor(n/31)-1,(n%31)+1),13);}
function nthWeekday(y,month,weekday,n){const first=new Date(y,month,1);const off=(weekday-first.getDay()+7)%7;return new Date(y,month,1+off+7*(n-1));}
const HOLIDAY_FN = {

/* ---------- Name-day lookup ---------- */
const norm = s=>(s||'').trim().split(/\s+/)[0].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ς/g,'σ').replace(/ł/g,'l');
function lookupNameday(name,country){
  const cal = country==='PL'?PL_CAL:country==='BG'?BG_CAL:country==='RO'?RO_CAL:country==='LV'?LV_CAL:(country==='RS'||country==='ME')?SR_CAL:(country==='GR'||country==='CY')?GR_CAL:null; if(!cal) return null;
  const k=norm(name);
  for(const [mmdd,names,rule] of cal){ if(names.some(n=>norm(n)===k)) return {mmdd,rule}; }
  return null;
}
function namedayFn(p){
  if(p.nameday) return fixedFn(p.nameday);
  const hit=lookupNameday(p.name,p.country); if(!hit) return null;
  if(hit.rule==='palm') return y=>addDays(orthodoxEaster(y),-7);
  const base=fixedFn(hit.mmdd);
  if(hit.rule==='george') return y=>{const g=base(y),e=orthodoxEaster(y);return g<e?addDays(e,1):g;};
  return base;
}

const GR_VOW=/[αεηιουωάέήίόύώϊϋΐΰ]+/g, GR_ACC=/[άέήίόύώΐΰ]/;
function vocWordEl(w){const r=vocWordEl0(w);return w.length>1&&w===w.toUpperCase()?r.toUpperCase():r;}
function vocWordEl0(w){
  if(!/[α-ωά-ώ]/i.test(w)) return w;
  const low=w.toLowerCase();
  if(/ος$/.test(low)){const stem=w.slice(0,-2), i=stem.search(GR_ACC);
    if(i<0) return stem+'ο';
    const after=stem.slice(i+1).toLowerCase().replace(/^[ιυ]/,'');
    return stem+((after.match(GR_VOW)||[]).length?'ε':'ο');}
  if(/ός$/.test(low)) return w.slice(0,-2)+'έ';
  if(/(ας|άς|ης|ής)$/.test(low)) return w.slice(0,-1);
  return w;
}
const vocEl=n=>String(n||'').split(/(\s+)/).map(vocWordEl).join('');
const callName=(p,lang)=>p.call?p.call:lang==='el'?vocEl(p.name):p.name;
const PHONE_CC=[['+357','CY'],['+359','BG'],['+381','RS'],['+382','ME'],['+371','LV'],['+30','GR'],['+48','PL'],['+40','RO'],['+44','GB'],['+49','DE'],['+33','FR'],['+39','IT'],['+34','ES'],['+353','IE'],['+61','AU'],['+1','US']];
function ccFromPhone(tel,def){const t=String(tel||'').replace(/[^\d+]/g,'').replace(/^00/,'+');const hit=PHONE_CC.find(([p])=>t.startsWith(p));return hit?hit[1]:def;}
function parseVcf(txt){
  const lines=String(txt).replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split(/\r?\n/), out=[]; let c=null;
  const val=l=>l.slice(l.indexOf(':')+1).trim().replace(/\\,/g,',').replace(/\\;/g,';');
  for(const l of lines){const u=l.toUpperCase();
    if(u.startsWith('BEGIN:VCARD')) c={};
    else if(u.startsWith('END:VCARD')){ if(c&&(c.fn||c.n)) out.push(c); c=null; }
    else if(!c) continue;
    else if(u.startsWith('FN')) c.fn=val(l);
    else if(u.startsWith('N:')||u.startsWith('N;')){const p=val(l).split(';');c.n=[p[1],p[0]].filter(Boolean).join(' ');}
    else if(u.startsWith('TEL')&&!c.tel) c.tel=val(l);
    else if(u.startsWith('EMAIL')&&!c.email) c.email=val(l);
    else if(u.startsWith('BDAY')){const b=val(l).replace(/-/g,'');const m=b.match(/(\d{2})(\d{2})$/); if(m) c.bday=m[1]+'-'+m[2];}
  }
  return out.map(x=>({name:(x.fn||x.n||'').trim(),phone:x.tel||'',email:x.email||'',bday:x.bday||''})).filter(x=>x.name);
}
function addImported(list){
  if(S.people.every(p=>p.ex)) S.people=[];
  const have=new Set(S.people.map(p=>p.name.toLowerCase())); let n=0;
  const defC=UI==='el'?'GR':UI==='pl'?'PL':UI==='bg'?'BG':UI==='ro'?'RO':UI==='lv'?'LV':(UI==='sr'||UI==='srl')?'RS':'GB';
  for(const x of list){ if(have.has(x.name.toLowerCase())) continue; const cc=ccFromPhone(x.phone,defC);
    S.people.push({id:'p'+Date.now()+'_'+(n++),name:x.name,rel:'',country:cc,lang:COUNTRY_LANG(cc),bday:x.bday||'',nameday:'',phone:x.phone||'',email:x.email||'',ex:false});
    have.add(x.name.toLowerCase()); }
  S.onboarded=true; save(); return n;
}
function importVcfFile(file,done){const r=new FileReader();r.onload=()=>{const n=addImported(parseVcf(r.result));done&&done();renderAll();toast(t('obImported',{n}));};r.readAsText(file);}
async function pickContacts(done){try{const res=await navigator.contacts.select(['name','tel','email'],{multiple:true});
  const n=addImported(res.map(c=>({name:(c.name||[])[0]||'',phone:(c.tel||[])[0]||'',email:(c.email||[])[0]||''})).filter(x=>x.name));done&&done();renderAll();toast(t('obImported',{n}));}catch(e){}}

function sendHref(via,p,text,subject){

function buildEvents(){
  const map=new Map();
  const push=(type,date,pid)=>{const key=type+'|'+iso(date);if(!map.has(key))map.set(key,{key,type,date,people:[]});map.get(key).people.push(pid);};
  for(const p of S.people){
    if(p.bday&&S.set.bday) push('birthday',nextBy(fixedFn(p.bday)),p.id);
    const nf=S.set.nameday&&namedayFn(p); if(nf) push('nameday',nextBy(nf),p.id);
    for(const h of holidaysFor(p.country)) if(S.set.hol[HOL_GROUP[h]]) push(h,nextBy(HOLIDAY_FN[h]),p.id);
    if(p.partner&&S.set.hol.valentine) push('valentine',nextBy(HOLIDAY_FN.valentine),p.id);
    if(p.partner&&S.set.hol.valentine&&(p.country==='RO'||p.country==='MD')) push('dragobete',nextBy(HOLIDAY_FN.dragobete),p.id);
    const sf=S.set.hol.slava&&slavaFn(p.slava); if(sf) push('slava',nextBy(sf),p.id);
    const role=roleOf(p), cc=p.country;
    if(S.set.hol.family){const mf=role==='mother'&&ruleFn(MOTHER_DAY[cc]); if(mf) push('mothers',nextBy(mf),p.id);
      const ff=role==='father'&&ruleFn(FATHER_DAY[cc]); if(ff) push('fathers',nextBy(ff),p.id);
      if((role==='mother'||role==='woman')&&WOMEN_DAY[cc]) push('womens',nextBy(ruleFn(WOMEN_DAY[cc])),p.id);}
    if(S.set.hol.national&&NATIONAL_DAY[cc]) push('national',nextBy(fixedFn(NATIONAL_DAY[cc])),p.id);
    const ld=S.set.love&&nextLove(p); if(ld) push('love',ld,p.id);
  }
  const out=[];
  for(const ev of map.values()){
    if(ev.type==='birthday'||ev.type==='nameday'||ev.type==='love'||ev.type==='slava'){for(const pid of ev.people) out.push({...ev,key:ev.key+'|'+pid,people:[pid]});}
    else out.push(ev);
  }
  return out.sort((a,b)=>a.date-b.date||a.type.localeCompare(b.type));
}

/* ---------- Composer ---------- */
const dlg=document.getElementById('dlg'), sheet=document.getElementById('sheet');
let C=null;
function startVariant(ev){return ev.type==='love'?Math.round((ev.date-new Date(ev.date.getFullYear(),0,1))/864e5):0;}
const FORMAL_REL=/συνεργ|πελάτ|συνάδελφ|προϊστ|διευθυντ|γείτ|colleague|client|boss|manager|współpr|klient|szef|kierown/i;
function tagOf(e){return e.startsWith('f|')?'f':e.startsWith('h|')?'h':'w';}
function wishPool(type,lang,tone='auto',rel=''){
  const w=TYPES[type].w, bank=WISHES[w]; const all=[...(bank[lang]||bank.en||bank.el)];
  let want = tone==='auto' ? (FORMAL_REL.test(rel||'')?['f']:['w','h']) : [tone];
  let arr=all.filter(e=>want.includes(tagOf(e)));
  if(!arr.length) arr=all;
  arr=arr.map(e=>e.replace(/^[fh]\|/,''));
  const own=S.set.custom[w+'|'+lang]; if(own) arr=[own,...arr];
  return arr;
}
function wishFor(type,lang,variant,name,year,tone='auto',rel='',feast='',country=''){
  let arr=wishPool(type,lang,tone,rel); if(!feast){const a=arr.filter(x=>!x.includes('{feast}')); if(a.length) arr=a;}
  return arr[((variant%arr.length)+arr.length)%arr.length].replaceAll('{name}',name).replaceAll('{year}',year).replaceAll('{feast}',feast||'').replaceAll('{flag}',flagOf(country)).trim();
}
function openComposer(ev){
  C={ev,idx:0,variant:0,tone:'auto'}; setRecipient(0); drawComposer(); dlg.showModal();
}
function setRecipient(i){
  C.idx=i; const p=person(C.ev.people[i]); C.lang=p.lang||COUNTRY_LANG(p.country); C.variant=startVariant(C.ev);
  C.text=wishFor(C.ev.type,C.lang,C.variant,callName(p,C.lang),C.ev.date.getFullYear(),C.tone,p.rel,feastFor(p,C.lang),p.country);
}
function fullText(){const s=S.plan==='free'?'\n\n'+SIGN[C.lang]:(S.set.sig?'\n\n'+S.set.sig:'');return C.text+s;}
function drawComposer(){
  const ev=C.ev,T=TYPES[ev.type],p=person(ev.people[C.idx]);
  const enc=encodeURIComponent(fullText());
  const digits=(p.phone||'').replace(/[^\d+]/g,'');
  const regen=()=>{C.text=wishFor(ev.type,C.lang,C.variant,callName(p,C.lang),ev.date.getFullYear(),C.tone,p.rel,feastFor(p,C.lang),p.country);drawComposer();};
  sheet.innerHTML=`<div class="grip"></div>
   <div><h2>${T.ic} ${esc(T.t)}</h2><p class="small">${esc(fmt.format(ev.date))} · ${days(ev.date)===0?t('todayLow'):inDays(days(ev.date))}</p></div>
   ${ev.people.length>1?`<div class="chips">${ev.people.map((pid,i)=>`<button class="chip" data-r="${i}" aria-pressed="${i===C.idx}">${esc(person(pid).name)}${isSent(ev,pid)?' <span class="ok">✓</span>':''}</button>`).join('')}</div>`:''}
   <div class="grid2">
    <label class="f">${t('wishLang')}<select id="c-lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${k===C.lang?' selected':''}>${v}</option>`).join('')}</select></label>
    <label class="f">${t('tone')}<select id="c-tone">${['auto','w','f','h'].map(k=>`<option value="${k}"${k===C.tone?' selected':''}>${t('tn_'+k)}</option>`).join('')}</select></label>
    <div class="f" style="justify-content:flex-end"><div class="row"><button class="ghost" id="c-next">${t('another')}</button><button class="ghost" id="c-ai">✨ AI<span class="lock">PREMIUM</span></button></div></div>
   </div>
   <label class="f">${esc(t('msgTo',{name:p.name}))}<textarea id="c-text">${esc(C.text)}</textarea></label>
   ${S.plan==='free'?`<p class="hint">${esc(t('sigHint',{sig:SIGN[C.lang]}))}</p>`:''}
   <div class="send">
    ${VIAS.map(([k,ic,lab])=>`<button data-via="${k}"${k===viaOf(p)?' style="border-color:var(--pink,#E3346E);border-width:2px"':''}><b>${ic}</b>${lab}</button>`).join('')}
    <button id="c-copy"><b>📋</b>${t('copy')}</button>
   </div>
   <p class="hint">${t('copyHint')}</p>
   <div class="row" style="justify-content:space-between">
    <button class="ghost" id="c-close">${t('close')}</button>
    <div class="row">${ev.people.length>1?`<button class="ghost" id="c-all">📨 ${t('toAll')} (${ev.people.length})<span class="lock">PREMIUM</span></button>`:''}
    <button class="primary" id="c-done">${isSent(ev,p.id)?t('sent'):t('iSent')}</button></div>
   </div>`;
  sheet.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{setRecipient(+b.dataset.r);drawComposer();});
  sheet.querySelector('#c-lang').onchange=e=>{C.lang=e.target.value;C.variant=startVariant(ev);regen();};
  sheet.querySelector('#c-tone').onchange=e=>{C.tone=e.target.value;C.variant=startVariant(ev);regen();};
  sheet.querySelector('#c-next').onclick=()=>{C.variant++;regen();};
  sheet.querySelector('#c-ai').onclick=()=>toast(S.plan==='premium'?t('aiSoon'):t('premiumOnly'));
  sheet.querySelector('#c-text').oninput=e=>{C.text=e.target.value;};
  sheet.querySelectorAll('.send [data-via]').forEach(b=>b.onclick=()=>doSend(b.dataset.via,p,fullText(),t('mailSubj')));
  sheet.querySelector('#c-copy').onclick=async()=>{const txt=fullText();
    try{await navigator.clipboard.writeText(txt);toast(t('copied'));}catch(e){const ta=sheet.querySelector('#c-text');ta.focus();ta.select();toast(t('selected'));}};
  sheet.querySelector('#c-close').onclick=()=>dlg.close();
  const all=sheet.querySelector('#c-all'); if(all) all.onclick=()=>openBulk(ev.people.map(pid=>({ev,pid})));
  sheet.querySelector('#c-done').onclick=()=>{
    S.sent[sentKey(ev,p.id)]=true;save();burst();
    const nextI=ev.people.findIndex(pid=>!isSent(ev,pid));
    if(nextI>=0){setRecipient(nextI);drawComposer();toast(t('nextP',{name:person(ev.people[nextI]).name}));}
    else{dlg.close();toast(t('allDone'));}
    renderAll(false);};
}

     <label class="f">${t('ndL')}<input type="date" id="p-nd" value="${toInput(d.nameday)}"></label></div>

     ${isNew?'<span></span>':`<button type="button" class="ghost danger" id="p-del">${t('del')}</button>`}

  const $=id=>sheet.querySelector('#'+id);

/* ---------- Confetti burst ---------- */
const fx=document.getElementById('fx'),ctx=fx.getContext('2d');
function burst(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const dpr=window.devicePixelRatio||1;fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);const cols=['--accent','--sun','--mint','--violet'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.7,vx:(Math.random()-.5)*12,vy:-Math.random()*13-5,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,
    w:5+Math.random()*5,h:3+Math.random()*3,c:cols[Math.floor(Math.random()*4)]}));
  let f=0;(function step(){ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const q of P){q.vy+=.35;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h);ctx.restore();}
    if(++f<80)requestAnimationFrame(step);else ctx.clearRect(0,0,innerWidth,innerHeight);})();
}
renderAll();
